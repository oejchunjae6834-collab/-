# Render Blueprint — 디적디적 홈페이지 무료 배포 설정
# 사용법: GitHub 저장소를 Render에 연결하면 이 파일을 자동 인식합니다.
#
# 비용:
#   - Web Service "free" : $0  (15분 idle 후 sleep, 첫 요청 ~30초 지연)
#   - Disk 없음 (DB와 사진은 Supabase에 저장)
#   합계: $0 (도메인 안 사면 완전 무료)

services:
  - type: web
    name: dijeokdijeok
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true              # Render가 랜덤 시크릿 자동 생성
      # ─── Supabase ────────────────────────────────────────────────
      - key: DATABASE_URL                  # Settings → Database → Connection string (Transaction pooler URI)
        sync: false
      - key: SUPABASE_URL                  # Settings → API → Project URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY     # Settings → API → service_role key
        sync: false
      # ─── 도메인 / 메일 ──────────────────────────────────────────
      - key: NEXT_PUBLIC_BASE_URL          # 배포 후 Render가 준 URL (또는 커스텀 도메인)
        sync: false
      - key: EMAIL_FROM                    # "디적디적 <noreply@yourdomain.com>" 또는 "onboarding@resend.dev"
        sync: false
      - key: RESEND_API_KEY                # 비워두면 매직링크가 Render 로그에만 출력됨
        sync: false

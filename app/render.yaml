# Render Blueprint — 디적디적 홈페이지 자동 배포 설정
# 사용법: GitHub 저장소를 Render에 연결하면 이 파일을 읽고 자동 생성합니다.
# 또는 https://dashboard.render.com/blueprints 에서 "New Blueprint Instance" 로 등록.
#
# 비용 예시 (2026 기준):
#   - Web Service "starter" : $7/월   (free 플랜은 15분 idle 후 sleep → 첫 요청 30초 지연)
#   - Disk 1GB              : $0.25/월
#   합계 ≈ $7.25/월

services:
  - type: web
    name: dijeokdijeok
    runtime: node
    plan: starter            # free 사용 가능하나 sleep + Disk 미지원이라 starter 권장
    rootDir: app             # 저장소에서 Next.js 앱이 들어 있는 폴더
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/dijeokdijeok.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true              # Render가 랜덤 시크릿 자동 생성
      - key: NEXT_PUBLIC_BASE_URL
        sync: false                       # 대시보드에서 수동 입력 (실제 도메인)
      - key: EMAIL_FROM
        sync: false                       # 예: "디적디적 <noreply@yourdomain.com>"
      - key: RESEND_API_KEY
        sync: false                       # Resend 가입 후 API 키 입력 (없으면 콘솔 폴백)
    disk:
      name: dijeokdijeok-data
      mountPath: /var/data                # SQLite + 업로드 사진 영구 저장
      sizeGB: 1
